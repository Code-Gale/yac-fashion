# YAC Fashion House - Nginx HTTP-only config (use BEFORE SSL certificates exist)
# After DNS points here, run: sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
# Certbot will add HTTPS and redirect automatically.

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=yac_api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=yac_web_limit:10m rate=30r/s;

upstream yac_api_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

upstream yac_web_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    client_max_body_size 10M;

    access_log /var/log/nginx/yac-fashion-house-access.log;
    error_log /var/log/nginx/yac-fashion-house-error.log warn;

    location /api/ {
        limit_req zone=yac_api_limit burst=20 nodelay;

        proxy_pass http://yac_api_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location / {
        limit_req zone=yac_web_limit burst=50 nodelay;

        proxy_pass http://yac_web_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://yac_web_backend;
        add_header Cache-Control "public, max-age=604800, immutable";
        expires 7d;
    }
}
