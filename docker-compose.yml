services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "5401:4000"
    volumes:
      - ./apps/api/src:/app/src
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGO_URI=mongodb://${MONGO_USER:-yacuser}:${MONGO_PASSWORD:-yacpass123}@mongodb:27017/yac-fashion?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispass123}@redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - yac-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo:7
    ports:
      - "127.0.0.1:27401:27017"  # Bind to localhost only for security
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-yacuser}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-yacpass123}
      - MONGO_INITDB_DATABASE=yac-fashion
    volumes:
      - mongodb_data:/data/db
    networks:
      - yac-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.adminCommand({ping:1})' --quiet | grep -q '{ ok: 1 }' && echo 0 || echo 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass123}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispass123}
    ports:
      - "127.0.0.1:16379:6379"  # Bind to localhost only for security
    volumes:
      - redis_data:/data
    networks:
      - yac-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-01T16-36-33Z  # Pin specific version
    restart: unless-stopped
    ports:
      - "127.0.0.1:19000:9000"  # Bind to localhost only for security
      - "127.0.0.1:19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - yac-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  yac-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  minio_data:
